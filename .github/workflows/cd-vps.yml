name: CD

# D-124: after CI is green on main, publish images then SSH retag + up on
# gennomx-ai-edge. Compose stays on local image: tags. No VPS_updateProjectV1.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cd-vps-ai
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  publish-and-deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: backend-meta
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=edge
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/metadata-action@v5
        id: frontend-meta
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=edge
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/ai
            NEXT_PUBLIC_API_URL=https://admin.gennomx.com/api/ai
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "89.116.214.14 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINdfKx0ehfuvk0npCr9wl6t4yEgtMAAmDGseEfY05r2B" >> ~/.ssh/known_hosts

      - name: Pull images on VPS and recreate edge
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA:0:7}"
          rsync -az scripts/cd-vps-remote.sh root@89.116.214.14:/tmp/gx-cd-ai.sh
          ssh -o StrictHostKeyChecking=yes root@89.116.214.14 \
            "GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' \
             BACKEND_IMAGE='${BACKEND_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' \
             IMAGE_TAG='$tag' bash /tmp/gx-cd-ai.sh"
