# Entry point para deploy Hostinger VPS (topologia gennomx.com).
# Adaptacao de infra/docker-compose.vps-app.yml sem env_file (Hostinger injeta
# variaveis via environment do projeto). Build context relativo a ./backend.
#
# Sobe Redis + MinIO + worker + beat. API sob profile `api` (nao sobe por default).
# Conecta-se a gennomx-ai-postgres-ready-private (external) para acessar o
# Postgres da stack gennomx-ai-postgres-ready.
#
# Hostinger resolve docker-compose.yaml no branch master do repo.
services:
  redis:
    image: redis:7.4.5-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    volumes:
      - gennomx_ai_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - gennomx_ai_app

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:?Set MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:?Set MINIO_SECRET_ACCESS_KEY}
    volumes:
      - gennomx_ai_minio_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - gennomx_ai_app

  worker:
    build:
      context: https://github.com/mvsscarmo-max/gennomx-ai.git#master:backend
      dockerfile: Dockerfile
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-vps_postgres}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the VPS Postgres}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL must point to the VPS Postgres}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:?DATABASE_URL_SYNC must point to the VPS Postgres}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must point to the VPS Redis}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL must point to the VPS Redis}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND must point to the VPS Redis}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:?AUTH_ADMIN_EMAIL must be set}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_ADMIN_PASSWORD_HASH: ${AUTH_ADMIN_PASSWORD_HASH:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-gennomx-ai}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-gennomx-dashboard}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID must be set}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY must be set}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-gennomx-ai-raw}
      MINIO_BUCKET_PROCESSED: ${MINIO_BUCKET_PROCESSED:-gennomx-ai-processed}
      MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE:-gennomx-ai-evidence}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    command:
      - "celery"
      - "-A"
      - "workers.celery_app"
      - "worker"
      - "--loglevel=info"
      - "-Q"
      - "ingest,process,ai"
      - "--concurrency=1"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - gennomx_ai_app
      - gennomx-ai-postgres-ready-private

  beat:
    build:
      context: https://github.com/mvsscarmo-max/gennomx-ai.git#master:backend
      dockerfile: Dockerfile
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-vps_postgres}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the VPS Postgres}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL must point to the VPS Postgres}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:?DATABASE_URL_SYNC must point to the VPS Postgres}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must point to the VPS Redis}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL must point to the VPS Redis}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND must point to the VPS Redis}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:?AUTH_ADMIN_EMAIL must be set}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_ADMIN_PASSWORD_HASH: ${AUTH_ADMIN_PASSWORD_HASH:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-gennomx-ai}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-gennomx-dashboard}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID must be set}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY must be set}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-gennomx-ai-raw}
      MINIO_BUCKET_PROCESSED: ${MINIO_BUCKET_PROCESSED:-gennomx-ai-processed}
      MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE:-gennomx-ai-evidence}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    command:
      - "celery"
      - "-A"
      - "workers.celery_app"
      - "beat"
      - "--loglevel=info"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - gennomx_ai_app

volumes:
  gennomx_ai_redis_data:
  gennomx_ai_minio_data:

networks:
  gennomx_ai_app:
    name: gennomx-ai-app
    internal: true
  gennomx-ai-postgres-ready-private:
    external: true
