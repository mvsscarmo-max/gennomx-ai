[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "gennomx-backend"
version = "0.1.0"
description = "GennomX AI — Backend: API, workers, MCP server"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Web framework
    "fastapi>=0.138.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.32",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",  # sync driver para alembic

    # Supabase
    "supabase>=2.4.0",
    "gotrue>=2.4.0",
    "storage3>=0.7.0",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",

    # Auth / Security
    "PyJWT[crypto]>=2.10.1",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",

    # Celery / Redis
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "kombu>=5.3.0",

    # HTTP clients
    "httpx>=0.27.0",
    "aiohttp>=3.14.1",
    "tenacity>=8.2.0",  # retry/backoff

    # Data processing
    "duckdb>=0.10.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "orjson>=3.10.0",
    "openpyxl>=3.1.0",  # EMA medicines export (.xlsx) parsing

    # Parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pypdf2>=3.0.0",
    "defusedxml>=0.7.1",  # hardened XML parsing for connector API responses (XXE mitigation)

    # Logging
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",

    # Utils
    "python-dotenv>=1.2.2",
    "click>=8.1.0",
    "rich>=13.7.0",
    "arrow>=1.3.0",
    "hashids>=1.3.0",
]

[project.optional-dependencies]
llm = [
    # Quarantined from the core runtime until a release containing the
    # CVE-2026-40217/CVE-2026-49468 fixes is available on the package index.
    "litellm>=1.84.0",
]
mcp = [
    # Isolated stdio process; kept out of the FastAPI runtime to avoid coupling
    # the two servers' Starlette dependency lifecycles.
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "factory-boy>=3.3.0",
    "faker>=24.0.0",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
    "sqlalchemy[mypy]>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "workers*", "migrations*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = [
    "S101",  # pytest asserts
    "S105",  # explicit placeholder secrets in local defaults
    "S608",  # dynamic SQL uses internal allowlisted fragments plus bound params
    "B008",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"migrations/**" = ["E501", "N999"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=app --cov=workers --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app", "workers"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]
