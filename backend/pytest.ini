[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -q
    --strict-markers
markers =
    unit: Unit tests (no external deps)
    integration: Integration tests (requires real DB)
    mcp: MCP server/tool tests
    connector: Connector/ingest tests
    slow: Slow tests (skip in fast CI runs)
filterwarnings =
    ignore::DeprecationWarning
